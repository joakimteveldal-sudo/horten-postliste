name: Update Horten postliste

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest postliste
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          SINCE=$(date -u -d "3 days ago" +%F)
          echo "Fetching Horten postliste since $SINCE"

          curl --fail \
            --silent \
            --show-error \
            --location \
            "https://horten-postliste.joakim-teveldal.workers.dev/overview?since=${SINCE}&maxPages=20" \
            -o data/overview.json

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/overview.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          if not data.get("ok"):
              raise SystemExit("Worker overview returned ok=false")

          print("Overview OK")
          print("Items:", data.get("count"))
          print("Pages:", data.get("pagesRead"))
          print("Fetched:", data.get("fetchedAt"))
          PY

      - name: Resolve public documents and PDFs
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          WORKER = "https://horten-postliste.joakim-teveldal.workers.dev"
          overview_path = Path("data/overview.json")
          output_path = Path("data/latest.json")

          data = json.loads(overview_path.read_text(encoding="utf-8"))
          items = data.get("items") or []

          documents_checked = 0
          public_files_found = 0
          pdfs_available = 0
          lookup_failures = 0

          for item in items:
              identifier = item.get("identifier")
              can_resolve = bool(item.get("canResolveDocumentDirectly"))

              item["documentLookupAttempted"] = False
              item["documentLookupStatus"] = (
                  "not_applicable" if not can_resolve else "pending"
              )
              item["document"] = None

              if not can_resolve or not identifier or not identifier.startswith("d-"):
                  continue

              item["documentLookupAttempted"] = True
              documents_checked += 1

              query = urllib.parse.urlencode({"id": identifier})
              url = f"{WORKER}/document?{query}"

              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "horten-postliste-github-action/1.0"},
                  )
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))

                  item["document"] = payload

                  if payload.get("ok"):
                      item["documentLookupStatus"] = payload.get("documentStatus") or "ok"
                  else:
                      item["documentLookupStatus"] = "worker_returned_not_ok"

                  item["pdfAvailable"] = bool(payload.get("pdfAvailable"))
                  item["pdfUrl"] = payload.get("pdfUrl")
                  item["pdfStatus"] = (
                      "available" if payload.get("pdfAvailable") else payload.get("documentStatus") or "not_available"
                  )

                  if payload.get("publicFilesAvailable"):
                      public_files_found += 1
                  if payload.get("pdfAvailable"):
                      pdfs_available += 1

              except Exception as exc:
                  lookup_failures += 1
                  item["documentLookupStatus"] = "lookup_failed"
                  item["documentLookupError"] = str(exc)
                  item["pdfAvailable"] = None
                  item["pdfUrl"] = None
                  item["pdfStatus"] = "lookup_failed"

          data["enrichment"] = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "documentsChecked": documents_checked,
              "publicFilesFound": public_files_found,
              "pdfsAvailable": pdfs_available,
              "lookupFailures": lookup_failures,
              "note": "Only entries with a direct d- document identifier are resolvable. a- case identifiers still require separate case-to-document resolution."
          }

          output_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Enrichment complete")
          print("Documents checked:", documents_checked)
          print("Public files found:", public_files_found)
          print("PDFs available:", pdfs_available)
          print("Lookup failures:", lookup_failures)
          PY

      - name: Validate enriched JSON
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json

          with open("data/latest.json", encoding="utf-8") as f:
              data = json.load(f)

          if not data.get("ok"):
              raise SystemExit("latest.json has ok=false")

          if "enrichment" not in data:
              raise SystemExit("latest.json is missing enrichment metadata")

          print("latest.json OK")
          print(json.dumps(data["enrichment"], ensure_ascii=False, indent=2))
          PY

      - name: Commit updated data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "horten-postliste-bot"
          git config user.email "horten-postliste-bot@users.noreply.github.com"

          git add data/overview.json data/latest.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Horten postliste data"
          git push
