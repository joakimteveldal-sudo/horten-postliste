name: One-time Horten postliste backfill page 9

on:
  push:
    paths:
      - '.github/workflows/backfill-page9.yml'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch remaining pages back to 2026-09-09
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 90 --retry 2 --retry-delay 3 --retry-all-errors \
            -A "horten-postliste-github-action/3.0 (polite public-records reader)" \
            "https://horten-postliste.joakim-teveldal.workers.dev/overview?since=2026-09-09&startPage=9&maxPages=8" \
            -o data/backfill-page9.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/backfill-page9.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if not d.get('ok'):
              raise SystemExit('Worker returned ok=false')
          print('startPage', d.get('startPage'))
          print('pagesRead', d.get('pagesRead'))
          print('count', d.get('count'))
          print('stoppedBecauseOld', d.get('stoppedBecauseOld'))
          print('hasMore', d.get('hasMore'))
          print('nextPage', d.get('nextPage'))
          PY
      - name: Commit backfill data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "horten-postliste-bot"
          git config user.email "horten-postliste-bot@users.noreply.github.com"
          git add data/backfill-page9.json
          git commit -m "Store one-time Horten postliste backfill page 9" || exit 0
          git push
